{% assign projects = site.data.projects %}{% for item in projects %}<div class="project-line"><div class="project-content"><h3><a href="{{item.url}}" target="_blank" rel="noopener">{{item.title}}</a></h3><p>{{item.description}}</p><a href="{{item.url}}" target="_blank" rel="noopener"><i class="fas fa-archive mr-1"></i> Acessar acervo</a></div><div class="project-art"><a href="{{ item.url }}" target="_blank" rel="noopener noreferrer" aria-label="Acessar {{ item.title }}"><img src="{{ item.image }}" alt="Capa do acervo {{ item.title }}" loading="lazy"></a></div></div>{% endfor %}
