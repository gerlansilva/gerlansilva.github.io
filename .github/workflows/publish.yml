name: Publicar Quarto no GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - '*.qmd'
      - '_quarto.yml'
      - 'quarto-custom.css'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Renderizar site
        run: quarto render
      - name: Publicar na pasta docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs
          git diff --cached --quiet || git commit -m "Build Quarto site"
          git push
