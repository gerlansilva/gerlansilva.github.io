name: Publicar Quarto no GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - '*.qmd'
      - '_quarto.yml'
      - 'quarto-custom.css'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quarto-build
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Renderizar Quarto
        run: |
          quarto render
          test -f docs/index.html
          if grep -q 'Error resolving header-includes' docs/index.html; then exit 1; fi
      - name: Publicar pasta docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+gerlansilva@users.noreply.github.com"
          git add -f docs
          if ! git diff --cached --quiet; then
            git commit -m "Build Quarto site"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep 3
            done
            exit 1
          fi
