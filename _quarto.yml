project:
  type: website
  output-dir: docs
  resources:
    - assets/**

website:
  title: "Gerlan Silva"
  site-url: https://gerlansilva.github.io
  description: "Portfólio acadêmico de Gerlan Silva: Educação Matemática, Educação Estatística, Educação Probabilística e acervos digitais."

  favicon: img/globo.ico

  open-graph: true

  navbar:
    background: "#14335A"
    foreground: "#ffffff"
    title: "Gerlan Silva"
    search: true
    right:
      - text: Início
        href: index.qmd
      - text: Sobre
        href: sobre/index.qmd
      - text: Pesquisas
        href: pesquisas/index.qmd
      - text: Publicações
        href: publicacoes/index.qmd
      - text: Projetos
        href: projetos/index.qmd
      - text: Apresentações
        href: apresentacoes/index.qmd
      - text: CV
        href: http://lattes.cnpq.br/2364822008221312
      - text: "PT"
        href: /
      - text: "EN"
        href: /en/
      - text: "ES"
        href: /es/
      - icon: github
        href: https://github.com/gerlansilva

format:
  html:
    theme:
      light: cosmo
      dark: cosmo
    css: styles.css
    include-after-body: footer.html
    toc: false
    link-external-newwindow: true
    include-in-header:
      - text: |
          <link rel="stylesheet" href="/assets/academicons/css/all.css">
          <link rel="stylesheet" href="/assets/academicons/css/size.css">
          <style>
            #title-block-header .quarto-title,
            #title-block-header .quarto-title .title,
            #title-block-header .quarto-title .subtitle { text-align: center; }
          </style>

lang: pt-BR
